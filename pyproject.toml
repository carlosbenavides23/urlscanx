[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urlscanx"
version = "0.2.0"
description = "Small CLI for inspecting and comparing urlscan.io results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "urlscanx contributors"}]
dependencies = []

[project.scripts]
urlscanx = "urlscanx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
